services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME em .env.prod}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER em .env.prod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env.prod
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate --noinput

  web:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      PORT: "8000"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    restart: unless-stopped
    env_file:
      - .env.prod
      - .env.fiplan
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python manage.py run_sync_scheduler

volumes:
  postgres_data:
