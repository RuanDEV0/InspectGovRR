services:
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL em .env}
      FIPLAN_USERNAME: ""
      FIPLAN_PASSWORD: ""
    command: python manage.py migrate --noinput

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL em .env}
      FIPLAN_USERNAME: ""
      FIPLAN_PASSWORD: ""
      PORT: "8000"
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL em .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python manage.py run_sync_scheduler
