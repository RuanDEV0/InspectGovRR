services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no arquivo .env}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python manage.py runserver 0.0.0.0:8000

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: python manage.py run_sync_scheduler

volumes:
  postgres_data:
