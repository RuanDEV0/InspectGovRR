{% load portal %}
<div class="ui-meta">
    {% if period %}<span class="ui-meta__period">{{ period }}</span>{% endif %}
    {% if updated_at %}<span>Atualizado em {{ updated_at }}</span>{% endif %}
    {% if status %}<span class="ui-badge ui-badge--neutral">{{ status }}</span>{% endif %}
    <button class="ui-seal" type="button" data-source-open hidden>{% icon 'shield-check' %}Registros da API Transparência RR</button>
</div>
